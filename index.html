<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>☕ 街角咖啡厅｜菜单</title>
  <style>
    :root {
      --bg-color: #f7f4ef;
      --card-bg: #ffffff;
      --primary-color: #3e2723;
      --accent-color: #c86b28;
      --accent-hover: #b05a1f;
      --text-main: #2c2c2c;
      --text-muted: #786c66;
      --border-radius: 16px;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .shop-name {
  font-size: 34px;
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.site-logo {
  height: 40px;
  width: auto;
  object-fit: contain;
}

    .shop-slogan {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Category Navigation */
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(62, 39, 35, 0.15);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    /* Grid Layout */
    .product-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Product Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .card-img-wrap {
      position: relative;
      height: 200px;
      width: 100%;
      overflow: hidden;
      background-color: #eae6e1;
    }

    .card-img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img {
      transform: scale(1.04);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
      min-height: 40px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 22px;
      color: var(--accent-color);
      font-weight: 700;
    }

    .buy-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .buy-btn:active {
      transform: scale(0.98);
    }

    /* Modal */
    .pay-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-inner {
      background: #fff;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-inner h3 {
      font-size: 20px;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .qrcode-img {
      width: 220px;
      height: 220px;
      margin: 16px auto;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    #payTip {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-color);
      margin-top: 8px;
    }

    .close-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary-color);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

async function loadProducts(){
  try {
    const res = await fetch("/api/feishu-proxy?shop_id=" + SHOP_ID);
    if (!res.ok) throw new Error("API not ready");
    const data = await res.json();
    if (data.records && data.records.length > 0) {
      allProducts = data.records;
    } else {
      allProducts = fallbackProducts;
    }
  } catch(e) {
    allProducts = fallbackProducts;
  }
  renderList(allProducts);
}

function renderList(list){
  const dom = document.getElementById("productList");
  dom.innerHTML = "";
  list.forEach(item => {
    const f = item.fields;
    const div = document.createElement("div");
    div.className = "card";
    
    const defaultImg = 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500';
    const imgSrc = f.img || (f["商品图片"] && f["商品图片"][0] && f["商品图片"][0].url) || defaultImg;
    const qrUrl = f.qr || (f["微信收款码"] && f["微信收款码"][0] && f["微信收款码"][0].url) || '';
    const tagText = f.tag || (item.category === 'dessert' ? '甜点' : '咖啡');

    div.innerHTML = `
      <div class="card-img-wrap">
        <span class="badge">${tagText}</span>
        <img class="card-img" src="${imgSrc}" alt="${f["商品名称"]}" onerror="this.onerror=null;this.src='${defaultImg}';">
      </div>
      <div class="card-body">
        <div>
          <div class="title">${f["商品名称"]}</div>
          <div class="desc">${f["商品描述"] || ""}</div>
        </div>
        <div class="row">
          <span class="price">¥${f["价格"]}</span>
          <button class="buy-btn" onclick="openPay('${qrUrl || 'images/qr-code.png'}', '${f["价格"]}')">立即购买</button>
        </div>
      </div>
    `;
    dom.appendChild(div);
  });
}
function filterCategory(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (cat === 'all') {
    renderList(allProducts);
  } else {
    const filtered = allProducts.filter(item => item.category === cat);
    renderList(filtered);
  }
}

function openPay(qrcodeUrl, price){
  const modal = document.getElementById("payModal");
  const qrImg = document.getElementById("payQrcode");
  if(!qrcodeUrl){
    alert("商家尚未配置微信收款码");
    return;
  }
  qrImg.src = qrcodeUrl;
  document.getElementById("payTip").innerText = `应付金额：¥${price}`;
  modal.style.display = "flex";
}

function closeModal(){
  document.getElementById("payModal").style.display = "none";
}
